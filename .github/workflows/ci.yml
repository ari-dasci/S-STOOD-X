name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Run ruff check
        run: uv run ruff check src/ tests/

  format-check:
    name: Format check (ruff format --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Check formatting
        run: uv run ruff format --check src/ tests/

  test:
    name: Hermetic tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Run hermetic tests
        run: uv run pytest tests/test_public_api.py tests/_openood_adapter/test_postprocessor_contract.py -v
