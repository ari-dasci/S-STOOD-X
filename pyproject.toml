[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stood-x"
version = "0.0.1"
authors = [
  { name="Ivan Sevillano-Garcia", email="isevillano@ugr.es" },
]
description = "STOOD-X methodology for OOD detection with explainability"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
        "zennit-crp[fast_img]>=0.6.0",
        "revel-xai>=1.0.3",
        "numpy>=2.1.2",
        "scikit-learn>=1.5.2",
        "scikit-image>=0.24.0",
        "torch>=2.4.1",
        "baycomp>=1.0.3",
        "matplotlib>=3.9.2",
        "scipy>=1.14.1",
        "pandas>=2.2.3",
        "torchvision>=0.19.1",
        "efficientnet_pytorch>=0.7.1",
        "tqdm>=4.66.5",
        "opencv-python>=4.10.0.84",
        "seaborn>=0.13.2",
        "plotly>=5.24.1",
        "statsmodels",
        "libmr",
        "openood",
        "timm>=0.9",
        "foolbox>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "sphinx>=8.0.2",
    "sphinx_rtd_theme>=3.0.0",
    "sphinxcontrib.bibtex>=2.6.3",
    "nbsphinx>=0.9.5",
    "pandoc>=2.4",
    "twine>=5.1.1",
    "IPython>=8.28.0",
    "ipywidgets>=8.1.5",
    "tensorboard>=2.18.0",
    "torchsummary>=1.5.1",
    "wget>=3.2",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 is absorbed by line-length=120 + `ruff format`; remaining long lines are
# LaTeX math / ML idioms that cannot wrap without breaking meaning.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These test modules are OpenOOD eval-harness scripts (NOT run in hermetic CI).
# They import networks (ResNet50/ViT_B_16/Swin_T/RegNet_Y_16GF/ResNet18_32x32),
# torchvision, pandas, json, and crp.* as registration/fixture imports that may
# take effect at import time or be referenced by the broader harness. They are
# intentionally preserved — suppressed, never deleted (spec: surgical policy).
"tests/_openood_adapter/test_postProcessor_cifar10.py" = ["F401"]
"tests/_openood_adapter/test_postProcessor_cifar100.py" = ["F401"]
"tests/_openood_adapter/test_postProcessor_imagenet.py" = ["F401"]
"tests/_openood_adapter/test_postProcessor_imagenet200.py" = ["F401"]
"tests/test_feature_visualization.py" = ["F401"]

[tool.uv.sources]
openood = { git = "https://github.com/Jingkang50/OpenOOD", rev = "3c35632ee91b54b09d1f085d04f94744cece7d0b" }

# libmr's setup.py imports numpy at build time but does not declare it in its
# own build-system.requires. This makes numpy available during libmr's isolated
# build only (build-time, not a runtime pin change).
[tool.uv.extra-build-dependencies]
libmr = ["numpy", "cython"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/ari-dasci/S-STOOD-X"